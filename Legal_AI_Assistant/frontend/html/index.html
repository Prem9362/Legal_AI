<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="nav">
    <div class="brand"><span class="logo">§</span> Contract Assistant</div>
    <span class="tag">Beta</span>
  </header>

  <main class="layout">

    <!-- Left: upload -->
    <aside class="card sidebar">
      <h2>Your document</h2>
      <p class="muted">Upload a contract PDF, then ask questions about it.</p>

      <label class="drop" id="drop">
        <input type="file" id="pdfFile" accept=".pdf" hidden>
        <span class="drop-icon">&#8679;</span>
        <span><b>Choose a PDF</b> or drag it here</span>
      </label>

      <div class="file-name" id="fileName" hidden></div>

      <button class="btn" id="uploadBtn">Upload &amp; analyse</button>
      <p class="status" id="status"></p>

      <p class="note">Answers are suggestions to review, not legal advice.</p>
    </aside>

    <!-- Right: chat -->
    <section class="card chat">
      <div class="messages" id="messages">
        <div class="msg bot">
          <div class="bubble">Hi! Upload a contract on the left and I'll answer questions using only what's written in it.</div>
        </div>
      </div>

      <div class="chips" id="chips">
        <button type="button">What are the fees and payment terms?</button>
        <button type="button">How can the agreement be terminated?</button>
        <button type="button">Does the contract auto-renew?</button>
      </div>

      <form class="ask" id="askForm">
        <input type="text" id="question" placeholder="Upload a PDF to start asking..." autocomplete="off" disabled>
        <button class="btn" id="askBtn" disabled>Ask</button>
      </form>
    </section>

  </main>

  <script src="/js/script.js"></script>
</body>
</html>
